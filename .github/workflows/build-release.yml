name: Build Release APK (manual)

# Chạy tay: Actions → "Build Release APK (manual)" → Run workflow.
# Chỉ build + lưu artifact. KHÔNG tự động chạy, KHÔNG publish lên Releases.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK with version
        id: ver
        run: |
          VER=$(grep -oP "versionName\s+'\\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk "wwm-fontpatch-${VER}.apk"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: wwm-fontpatch-${{ steps.ver.outputs.ver }}
          path: wwm-fontpatch-${{ steps.ver.outputs.ver }}.apk
          retention-days: 30
