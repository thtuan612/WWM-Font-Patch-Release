name: Build APK

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test pure-Java core (codec / hotfix logic)
        run: |
          python3 tools/test/check.py

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK with version
        id: ver
        run: |
          VER=$(grep -oP "versionName\s+'\\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk "app-released-${VER}.apk"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: wwm-fontpatch-${{ steps.ver.outputs.ver }}
          path: app-released-${{ steps.ver.outputs.ver }}.apk

